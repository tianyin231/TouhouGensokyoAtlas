name: Scene build and regression
on:
  push:
    branches: [main, work/higan]
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build and verify independent source
        run: |
          python3 tools/build.py
          node tools/check.mjs
          node tools/audit-landmarks.mjs
          cp dist/SHA256SUMS.txt /tmp/first.sha
          python3 tools/build.py
          cmp dist/SHA256SUMS.txt /tmp/first.sha
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: checked-atlas
          path: |
            dist/*.html
            dist/release.json
            dist/SHA256SUMS.txt
            dist/landmarks-*.json
            dist/landmarks-*.md
          retention-days: 7
