name: Scene build and regression
on:
  push:
    branches: [main, work/animal]
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build and verify independent source
        run: |
          python3 tools/build.py
          node tools/check.mjs
          node tools/audit-landmarks.mjs
      - name: Rebuild from a clean tracked-source snapshot
        run: |
          git archive --format=tar.gz --output=/tmp/atlas-source.tar.gz HEAD
          mkdir /tmp/clean-atlas
          tar -xzf /tmp/atlas-source.tar.gz -C /tmp/clean-atlas
          python3 /tmp/clean-atlas/tools/build.py
          node /tmp/clean-atlas/tools/check.mjs /tmp/clean-atlas/dist
          cmp dist/SHA256SUMS.txt /tmp/clean-atlas/dist/SHA256SUMS.txt
          cmp dist/release.json /tmp/clean-atlas/dist/release.json
          cp /tmp/atlas-source.tar.gz dist/atlas-source.tar.gz
          git rev-parse HEAD > dist/source-commit.txt
      - name: Install optional browser regression dependencies
        run: |
          python3 -m pip install playwright==1.57.0
          python3 -m playwright install --with-deps chromium
      - name: Verify real HTTP WebGL and native Worker integration
        run: |
          python3 tools/check-backdoor-browser.py
          python3 tools/check-browser.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: checked-atlas
          path: |
            dist/*.html
            dist/release.json
            dist/SHA256SUMS.txt
            dist/landmarks-*.json
            dist/landmarks-*.md
            dist/atlas-source.tar.gz
            dist/source-commit.txt
            dist/backdoor-browser-check/
            dist/browser-check/
          retention-days: 7
